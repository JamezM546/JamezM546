      <stop offset="0%" stop-color="#0B1026"/>
      <stop offset="55%" stop-color="#1A1640"/>
      <stop offset="100%" stop-color="#2A1F4D"/>
    </linearGradient>
  </defs>

  <rect width="900" height="140" fill="url(#sky)"/>

